name: ci

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # Pinned to the version the goldens were rasterized with —
          # text shaping shifts between engine versions and would diff
          # the images without any real regression.
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
